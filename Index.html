
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DarjeelingHost V1</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f7;
  color:#202b35;
}

main{
  max-width:420px;
  margin:50px auto;
  padding:25px;
  background:white;
  border-radius:12px;
  box-shadow:0 5px 25px rgba(0,0,0,.06);
}

h1{margin:0;color:#173d59}
p{color:#697782}

label{
  display:block;
  margin:15px 0 6px;
}

input,select,button{
  width:100%;
  padding:12px;
  border:1px solid #ccd5dd;
  border-radius:7px;
  font-size:15px;
}

button{
  background:#173d59;
  color:white;
  border:0;
  margin-top:16px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.secondary{
  background:#e8edf1;
  color:#173d59;
}

.link{
  background:none;
  color:#17628e;
  padding:0;
  width:auto;
  margin:0;
}

.hidden{display:none}

#message{
  margin-top:15px;
  font-size:14px;
  line-height:1.5;
  overflow-wrap:anywhere;
}
</style>
</head>

<body>
<main>

<h1>DarjeelingHost</h1>
<p>Driver Outsourcing Platform · V1</p>

<!-- REGISTRATION -->

<section id="register">

<h3>Create Account</h3>

<label for="name">Full Name</label>
<input id="name" autocomplete="name"
placeholder="Full name">

<label for="type">Account Type</label>
<select id="type">
<option value="driver">Driver</option>
<option value="travel_agent">Travel Agent</option>
</select>

<label for="email">Email</label>
<input id="email" type="email"
autocomplete="email" placeholder="Email address">

<label for="password">Password</label>
<input id="password" type="password"
autocomplete="new-password"
placeholder="Minimum 6 characters">

<button id="registerBtn">Register</button>

<p>Already registered?
<button class="link" id="goLogin">Login</button>
</p>

</section>

<!-- LOGIN -->

<section id="login" class="hidden">

<h3>Login</h3>

<label for="loginEmail">Email</label>
<input id="loginEmail" type="email"
autocomplete="email">

<label for="loginPassword">Password</label>
<input id="loginPassword" type="password"
autocomplete="current-password">

<button id="loginBtn">Login</button>

<p>
<button class="link" id="goRegister">
Create account
</button>
</p>

</section>

<!-- DASHBOARD -->

<section id="dashboard" class="hidden">

<h3 id="welcome"></h3>
<p id="details"></p>

<button class="secondary" id="logoutBtn">
Logout
</button>

</section>

<div id="message" role="status"
aria-live="polite"></div>

</main>

<!-- FIREBASE SDK -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

// FIREBASE CONFIGURATION

const firebaseConfig = {
  apiKey: "AIzaSyAV9MggoBLbr6IQ6NN6xF5tSRwqy0EL17g",
  authDomain: "studio-5524327838-803a4.firebaseapp.com",
  projectId: "studio-5524327838-803a4",
  storageBucket: "studio-5524327838-803a4.firebasestorage.app",
  messagingSenderId: "4756587991",
  appId: "1:4756587991:web:e5472eb8282e25b05c7792"
};

// INITIALIZE FIREBASE

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const $ = id => document.getElementById(id);

function message(text){
  $("message").textContent = text;
}

function page(name){
  ["register","login","dashboard"].forEach(id=>{
    $(id).classList.add("hidden");
  });

  $(name).classList.remove("hidden");
  message("");
}

// NAVIGATION

$("goLogin").onclick = () => page("login");

$("goRegister").onclick = () => page("register");

// REGISTRATION

$("registerBtn").onclick = async () => {

  const name = $("name").value.trim();
  const type = $("type").value;
  const email = $("email").value.trim();
  const password = $("password").value;

  if(!name || !email || password.length < 6){
    message("Enter your details. Password must contain at least 6 characters.");
    return;
  }

  if(!["driver","travel_agent"].includes(type)){
    message("Invalid account type.");
    return;
  }

  try{

    $("registerBtn").disabled = true;
    message("Creating account...");

    const result = await auth.createUserWithEmailAndPassword(
      email,
      password
    );

    await db.collection("users").doc(result.user.uid).set({

      name: name,
      email: email,
      accountType: type,

      // New accounts require approval.
      status: "pending",

      createdAt: firebase.firestore.FieldValue.serverTimestamp()

    });

    message("Registration successful. Your account is pending approval.");

  }catch(error){

    message(error.message);

  }finally{

    $("registerBtn").disabled = false;

  }

};

// LOGIN

$("loginBtn").onclick = async () => {

  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  if(!email || !password){
    message("Enter your email and password.");
    return;
  }

  try{

    $("loginBtn").disabled = true;
    message("Logging in...");

    await auth.signInWithEmailAndPassword(
      email,
      password
    );

  }catch(error){

    message(error.message);

  }finally{

    $("loginBtn").disabled = false;

  }

};

// AUTHENTICATION STATE

auth.onAuthStateChanged(async user => {

  if(!user){
    page("register");
    return;
  }

  try{

    const doc = await db.collection("users")
      .doc(user.uid)
      .get();

    if(!doc.exists){

      page("dashboard");

      $("welcome").textContent = "Account profile unavailable";

      $("details").textContent =
        "Please contact the administrator.";

      return;
    }

    const data = doc.data();

    page("dashboard");

    $("welcome").textContent =
      "Welcome, " + (data.name || "User");

    const role = data.accountType === "travel_agent"
      ? "Travel Agent"
      : "Driver";

    $("details").textContent =
      role + " | Status: " + data.status +
      ". Operational access requires approval.";

  }catch(error){

    message(error.message);

  }

});

// LOGOUT

$("logoutBtn").onclick = async () => {

  try{
    await auth.signOut();
    message("Logged out successfully.");
  }catch(error){
    message(error.message);
  }

};

</script>
</body>
</html>
