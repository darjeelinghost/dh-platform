
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post a Trip | DarjeelingHost</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      color: #202b35;
    }

    header {
      background: #173b65;
      color: white;
      padding: 17px 22px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: .85;
    }

    main {
      max-width: 850px;
      margin: 28px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    h2 {
      margin-top: 0;
      color: #173b65;
    }

    .intro {
      color: #687582;
      line-height: 1.5;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 17px;
    }

    .field {
      margin-top: 17px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd4dc;
      border-radius: 7px;
      font-size: 15px;
      background: white;
      color: #202b35;
    }

    textarea {
      min-height: 105px;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid #8eb8e8;
      border-color: #2874c7;
    }

    .checkbox {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 22px;
      font-size: 14px;
      line-height: 1.5;
    }

    .checkbox input {
      width: 18px;
      height: 18px;
      margin-top: 1px;
      flex-shrink: 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 25px;
    }

    button, .cancel {
      border: 0;
      border-radius: 8px;
      padding: 13px 21px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .submit {
      background: #2467c7;
      color: white;
    }

    .submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .clear {
      background: #edf0f3;
      color: #263746;
    }

    .cancel {
      background: white;
      color: #263746;
      border: 1px solid #ccd4dc;
    }

    #formMessage {
      display: none;
      padding: 13px;
      border-radius: 7px;
      margin-top: 20px;
      line-height: 1.5;
      font-size: 14px;
    }

    #formMessage.success {
      display: block;
      background: #e7f6ed;
      color: #176b3a;
    }

    #formMessage.error {
      display: block;
      background: #fdecec;
      color: #a32626;
    }

    #formMessage.info {
      display: block;
      background: #eaf2fc;
      color: #214e80;
    }

    .note {
      font-size: 12px;
      color: #71808d;
      margin-top: 7px;
    }

    @media (max-width: 620px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .card {
        padding: 19px;
      }

      .actions button,
      .actions a {
        flex: 1;
        text-align: center;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>DarjeelingHost</h1>
  <p>Trip outsourcing and driver network</p>
</header>

<main>
  <section class="card">

    <h2>Post a Trip</h2>

    <p class="intro">
      Share your trip requirements with the DarjeelingHost
      driver network. Provide accurate travel, vehicle and fare
      information.
    </p>

    <form id="tripForm">

      <div class="grid">

        <div class="field full">
          <label for="pickupLocation">Pickup Location *</label>
          <input
            id="pickupLocation"
            name="pickupLocation"
            placeholder="e.g. Chowk Bazaar"
            required
            maxlength="150"
          >
        </div>

        <div class="field">
          <label for="source">Source *</label>
          <input
            id="source"
            name="source"
            placeholder="Starting location"
            required
            maxlength="150"
          >
        </div>

        <div class="field">
          <label for="destination">Destination *</label>
          <input
            id="destination"
            name="destination"
            placeholder="Destination"
            required
            maxlength="150"
          >
        </div>

        <div class="field">
          <label for="travelDate">Travel Date *</label>
          <input
            type="date"
            id="travelDate"
            name="travelDate"
            required
          >
        </div>

        <div class="field">
          <label for="travelTime">Pickup Time *</label>
          <input
            type="time"
            id="travelTime"
            name="travelTime"
            required
          >
        </div>

        <div class="field">
          <label for="tripType">Trip Type *</label>
          <select id="tripType" name="tripType" required>
            <option value="">Select trip type</option>
            <option value="One-way">One-way</option>
            <option value="Round trip">Round trip</option>
            <option value="Sightseeing">Sightseeing</option>
            <option value="Airport transfer">Airport transfer</option>
            <option value="Local transfer">Local transfer</option>
            <option value="Custom trip">Custom trip</option>
          </select>
        </div>

        <div class="field">
          <label for="vehicleType">Required Vehicle *</label>
          <select id="vehicleType" name="vehicleType" required>
            <option value="">Select vehicle</option>
            <option value="Hatchback">Hatchback</option>
            <option value="Sedan">Sedan</option>
            <option value="Luxury Vehicle">Luxury Vehicle</option>
            <option value="Innova">Innova</option>
            <option value="Innova Crysta">Innova Crysta</option>
            <option value="Sumo">Sumo</option>
            <option value="Omni">Omni</option>
            <option value="Van">Van</option>
            <option value="Traveller">Traveller</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="seats">Passenger Seats *</label>
          <input
            type="number"
            id="seats"
            name="seats"
            min="1"
            max="50"
            required
          >
        </div>

        <div class="field">
          <label for="fare">Offered Fare (INR) *</label>
          <input
            type="number"
            id="fare"
            name="fare"
            min="1"
            step="1"
            placeholder="e.g. 2500"
            required
          >
        </div>

        <div class="field">
          <label for="negotiable">Is the Fare Negotiable? *</label>
          <select id="negotiable" name="negotiable" required>
            <option value="">Select option</option>
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
        </div>

        <div class="field full">
          <label for="description">
            Itinerary / Additional Details
          </label>
          <textarea
            id="description"
            name="description"
            maxlength="2000"
            placeholder="Useful for sightseeing and custom trips, including stops, duration and special instructions."
          ></textarea>
        </div>

      </div>

      <label class="checkbox">
        <input
          type="checkbox"
          id="confirmAccuracy"
          required
        >
        <span>
          I confirm that the trip details and fare information
          provided above are accurate.
        </span>
      </label>

      <div id="formMessage" role="alert"></div>

      <div class="actions">
        <button
          type="submit"
          class="submit"
          id="publishBtn"
        >
          Submit Trip
        </button>

        <button
          type="reset"
          class="clear"
        >
          Clear Form
        </button>

        <a href="dashboard.html" class="cancel">
          Cancel
        </a>
      </div>

    </form>
  </section>
</main>

<script type="module">
  import { auth, db, getUserProfile }
    from "./js/firebase.js";

  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

  import {
    addDoc,
    collection,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

  const form = document.getElementById("tripForm");
  const submitButton = document.getElementById("publishBtn");
  const message = document.getElementById("formMessage");

  let currentUser = null;
  let currentProfile = null;
  let authReady = false;

  function showMessage(text, type = "info") {
    message.textContent = text;
    message.className = type;
  }

  function localToday() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }

  document.getElementById("travelDate").min = localToday();

  onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    currentProfile = null;
    authReady = true;

    if (!user) {
      showMessage(
        "Please sign in before posting a trip.",
        "error"
      );
      submitButton.disabled = true;
      return;
    }

    try {
      currentProfile = await getUserProfile(user.uid);

      if (
        !user.emailVerified ||
        !currentProfile ||
        currentProfile.status !== "active" ||
        !["driver", "broker"].includes(currentProfile.role)
      ) {
        showMessage(
          "Only approved, active Driver and Broker accounts can post trips.",
          "error"
        );
        submitButton.disabled = true;
        return;
      }

      submitButton.disabled = false;
      showMessage(
        "Your account is ready. You can submit a trip.",
        "info"
      );

    } catch (error) {
      console.error("Account check failed:", error);

      showMessage(
        "Unable to verify your account. Please try again.",
        "error"
      );

      submitButton.disabled = true;
    }
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!authReady || !currentUser || !currentProfile) {
      showMessage(
        "Please sign in with an approved account before posting.",
        "error"
      );
      return;
    }

    if (
      !currentUser.emailVerified ||
      currentProfile.status !== "active" ||
      !["driver", "broker"].includes(currentProfile.role)
    ) {
      showMessage(
        "Your account is not authorised to post trips.",
        "error"
      );
      return;
    }

    if (!form.reportValidity()) return;

    const travelDate = document.getElementById("travelDate").value;
    const travelTime = document.getElementById("travelTime").value;

    if (travelDate < localToday()) {
      showMessage(
        "Please select today or a future travel date.",
        "error"
      );
      return;
    }

    const fare = Number(document.getElementById("fare").value);
    const seats = Number(document.getElementById("seats").value);

    if (!Number.isSafeInteger(fare) || fare <= 0) {
      showMessage(
        "Enter a valid fare greater than zero.",
        "error"
      );
      return;
    }

    if (!Number.isInteger(seats) || seats < 1 || seats > 50) {
      showMessage(
        "Enter a valid passenger seat number.",
        "error"
      );
      return;
    }

    if (!document.getElementById("confirmAccuracy").checked) {
      showMessage(
        "Please confirm that the trip information is accurate.",
        "error"
      );
      return;
    }

    const trip = {
      pickupLocation: document.getElementById("pickupLocation").value.trim(),
      source: document.getElementById("source").value.trim(),
      destination: document.getElementById("destination").value.trim(),
      travelDate,
      travelTime,
      tripType: document.getElementById("tripType").value,
      vehicleType: document.getElementById("vehicleType").value,
      seats,
      fare,
      negotiable: document.getElementById("negotiable").value === "true",
      description: document.getElementById("description").value.trim(),

      posterUid: currentUser.uid,
      posterName:
        currentProfile.displayName ||
        currentUser.displayName ||
        "DarjeelingHost User",
      posterRole: currentProfile.role,

      status: "open",
      moderationStatus: "pending",

      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    };

    try {
      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";

      await addDoc(collection(db, "trips"), trip);

      showMessage(
        "Your trip has been submitted successfully. It is awaiting platform review before appearing in the marketplace.",
        "success"
      );

      form.reset();
      document.getElementById("travelDate").min = localToday();

    } catch (error) {
      console.error("Trip submission failed:", error);

      if (error.code === "permission-denied") {
        showMessage(
          "Firestore rejected this submission. The security rules may need to be updated to match the trip fields.",
          "error"
        );
      } else {
        showMessage(
          error.message || "Unable to submit your trip. Please try again.",
          "error"
        );
      }

    } finally {
      submitButton.disabled = false;
      submitButton.textContent = "Submit Trip";
    }
  });
</script>

</body>
</html>
