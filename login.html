
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b46">
  <title>Login | DarjeelingHost</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="container navbar">
    <a href="index.html" class="brand">Darjeeling<span>Host</span></a>
    <a href="index.html" class="btn btn-outline">Back to Home</a>
  </div>
</header>

<main class="container">
  <div class="form-container">

    <h2 style="color:var(--primary);text-align:center;">
      Welcome Back
    </h2>

    <p style="color:var(--muted);text-align:center;">
      Login to your DarjeelingHost account.
    </p>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>

      <p id="loginMessage" role="status" aria-live="polite"></p>

      <button type="submit" class="btn btn-primary" style="width:100%;">
        Login
      </button>

    </form>

    <p style="text-align:center;margin-top:22px;font-size:14px;">
      Don't have an account?
      <a href="register.html" style="color:var(--secondary);font-weight:bold;">
        Register here
      </a>
    </p>

  </div>
</main>

<footer>
  <div class="container footer-content">
    <strong>DarjeelingHost</strong>
    <p>© <span id="year"></span> DarjeelingHost</p>
  </div>
</footer>

<script>
  document.getElementById("year").textContent =
    new Date().getFullYear();

  document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    document.getElementById("loginMessage").textContent =
      "Login functionality will be connected to Firebase in the next development step.";
  });
</script>

</body>
</html>
