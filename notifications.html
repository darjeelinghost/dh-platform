
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#172b3a">
  <title>Notifications | DarjeelingHost</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f3f6f8;
      color: #24323d;
      font-family: Arial, sans-serif;
    }

    .topbar {
      background: #172b3a;
      color: white;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .brand { font-size: 20px; font-weight: 700; }

    .nav {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .nav a, .nav button {
      color: white;
      text-decoration: none;
      background: none;
      border: 0;
      cursor: pointer;
      font-size: 14px;
    }

    .container {
      width: min(850px, 92%);
      margin: 30px auto;
    }

    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    h1 { margin: 0 0 7px; font-size: 26px; }

    .muted { color: #687783; font-size: 14px; }

    .card {
      background: white;
      border: 1px solid #dce3e8;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1px solid #dce3e8;
      background: white;
      padding: 9px 13px;
      border-radius: 20px;
      cursor: pointer;
      color: #344653;
      font-size: 13px;
    }

    .filter-btn.active {
      background: #245b78;
      color: white;
      border-color: #245b78;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #245b78;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .notification {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 17px 0;
      border-bottom: 1px solid #edf0f2;
    }

    .notification:last-child { border-bottom: 0; }

    .notification-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 50%;
      background: #eaf2f6;
      color: #245b78;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .notification-content { flex: 1; min-width: 0; }

    .notification-title {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 700;
    }

    .notification-message {
      margin: 0 0 8px;
      color: #586873;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .notification-time { color: #87939c; font-size: 12px; }

    .notification.unread {
      background: #f5f9fc;
      margin: 0 -12px;
      padding-left: 12px;
      padding-right: 12px;
      border-radius: 8px;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      background: #2878a2;
      border-radius: 50%;
      margin-top: 6px;
      flex: 0 0 8px;
    }

    .empty-state {
      text-align: center;
      padding: 45px 15px;
      color: #687783;
    }

    .empty-state strong {
      display: block;
      color: #344653;
      font-size: 16px;
      margin-bottom: 8px;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .message.show { display: block; }
    .message.error { background: #fdeaea; color: #8b2525; }
    .message.success { background: #e8f5ec; color: #24613a; }

    @media (max-width: 600px) {
      .container { margin-top: 22px; }
      .card { padding: 15px; }
      h1 { font-size: 23px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">DarjeelingHost</div>

    <nav class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="driver-profile.html">Profile</a>
      <a href="trip-history.html">Trip History</a>
      <button type="button" id="logoutBtn">Logout</button>
    </nav>
  </header>

  <main class="container">
    <div class="page-heading">
      <div>
        <h1>Notifications</h1>
        <p class="muted">Stay informed about your trips and account activity.</p>
      </div>

      <button type="button" class="btn" id="markAllReadBtn">
        Mark All as Read
      </button>
    </div>

    <div id="notificationMessage" class="message" role="status" aria-live="polite"></div>

    <section class="card">
      <div class="toolbar">
        <div>
          <strong id="notificationCount">Loading notifications...</strong>
          <p class="muted" style="margin:5px 0 0;">Your personal notification centre</p>
        </div>

        <div class="filters" role="group" aria-label="Notification filters">
          <button type="button" class="filter-btn active" data-filter="all">All</button>
          <button type="button" class="filter-btn" data-filter="unread">Unread</button>
          <button type="button" class="filter-btn" data-filter="read">Read</button>
        </div>
      </div>
    </section>

    <section class="card" aria-label="Your notifications">
      <div id="notificationList" aria-live="polite">
        <div class="empty-state">
          <strong>Loading notifications</strong>
          Please wait...
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/notifications.js"></script>
</body>
</html>
